AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Clean Period - forecast and plan API (ap-south-1)

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Frontend origin allowed by CORS. Set to the Amplify URL once it exists.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: ../backend
    MemorySize: 256
    Timeout: 25
    Environment:
      Variables:
        TABLE_NAME: !Ref Table

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [content-type, x-edit-key]

  # Single table: School, Timetable, Plan, ForecastCache. Keys pk/sk.
  # Items with expires_at (epoch seconds) are removed by DynamoDB TTL.
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
        - {AttributeName: gsi1pk, AttributeType: S}
        - {AttributeName: gsi1sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      # Lists saved schools for the nightly run (gsi1pk=SCHOOL).
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - {AttributeName: gsi1pk, KeyType: HASH}
            - {AttributeName: gsi1sk, KeyType: RANGE}
          Projection: {ProjectionType: KEYS_ONLY}
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  ForecastFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.forecast.app.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
      Events:
        Get:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /forecast, Method: GET}

  PlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.plan.app.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
      Events:
        Post:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /plan, Method: POST}

  NoticeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.notice.app.handler
      Timeout: 28           # HTTP API integrations time out at 30 s
      MemorySize: 512
      Environment:
        Variables:
          NOTICE_USE_AI: "1"
          NOTICE_MODEL: apac.amazon.nova-pro-v1:0
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-pro-v1:0
                - arn:aws:bedrock:*::foundation-model/amazon.nova-pro-v1:0
      Events:
        Post:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /notice, Method: POST}

  SchoolsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.schools.app.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
      Events:
        Create:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /schools, Method: POST}
        Get:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/schools/{id}", Method: GET}
        Update:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/schools/{id}", Method: PUT}
        LatestPlan:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: "/schools/{id}/plans/latest", Method: GET}

  # Every evening at 19:00 IST: plan tomorrow for every saved school.
  NightlyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions.nightly.app.handler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
      Events:
        Evening:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 19 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            RetryPolicy: {MaximumRetryAttempts: 0}

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  TableName:
    Value: !Ref Table
